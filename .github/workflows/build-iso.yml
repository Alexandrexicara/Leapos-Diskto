name: Construir ISO LeapOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'auto/**'
      - 'config/**'
      - 'src/**'
      - '.github/workflows/build-iso.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools
      - name: Configurar Debian Live
        run: sudo sh auto/config
      - name: Construir ISO
        run: sudo lb build
      - name: Corrigir permissao do artefato
        if: always()
        run: sudo chown -R "$USER:$USER" .
      - name: Publicar ISO
        uses: actions/upload-artifact@v4
        with:
          name: leapos-live-iso
          path: '*.iso'
          if-no-files-found: error
          retention-days: 14
